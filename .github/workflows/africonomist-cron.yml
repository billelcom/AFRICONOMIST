name: Africonomist 30-Minute Cycle

on:
  schedule:
    # يعمل تلقائياً كل 30 دقيقة بدقة متناهية ومجاناً 100% عبر خوادم GitHub
    - cron: '*/30 * * * *'
  # إمكانية التشغيل اليدوي من تبويب Actions في GitHub في أي وقت
  workflow_dispatch:

jobs:
  trigger-30min-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Periodic Cycle Endpoint
        run: |
          # استدعاء الـ endpoint المنشور على Vercel
          # يمكنك وضع رابط موقعك وسر الحماية في GitHub Repository Secrets:
          # VERCEL_APP_URL = https://your-site.vercel.app
          # CRON_SECRET = your_secret_token (اختياري)
          
          TARGET_URL="${{ secrets.VERCEL_APP_URL }}"
          TARGET_SECRET="${{ secrets.CRON_SECRET }}"
          
          if [ -z "$TARGET_URL" ]; then
            echo "⚠️ [Notice] VERCEL_APP_URL secret is not set yet in GitHub Secrets."
            echo "Please go to Repo Settings -> Secrets and variables -> Actions -> New repository secret -> VERCEL_APP_URL"
            exit 0
          fi
          
          echo "🚀 Triggering 30-min cycle at $TARGET_URL/api/cron/trigger..."
          curl -s -X POST "$TARGET_URL/api/cron/trigger?key=$TARGET_SECRET" \
            -H "Authorization: Bearer $TARGET_SECRET" \
            -H "Content-Type: application/json"
          
          echo "✅ Trigger completed."
