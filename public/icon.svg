<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A14"/>
      <stop offset="50%" stop-color="#0E1626"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect width="510" height="510" x="1" y="1" rx="107" fill="none" stroke="#F59E0B" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Subtle grid lines resembling financial charts -->
  <g stroke="#334155" stroke-opacity="0.25" stroke-width="1.5">
    <line x1="80" y1="160" x2="432" y2="160"/>
    <line x1="80" y1="240" x2="432" y2="240"/>
    <line x1="80" y1="320" x2="432" y2="320"/>
    <line x1="80" y1="400" x2="432" y2="400"/>
  </g>

  <!-- Central Emblem: Stylized African continent silhouette intertwined with financial growth bars -->
  <g transform="translate(106, 80)">
    <!-- Dynamic financial rising bars in the background -->
    <rect x="50" y="240" width="28" height="90" rx="6" fill="#3B82F6" fill-opacity="0.3"/>
    <rect x="95" y="190" width="28" height="140" rx="6" fill="url(#emeraldGrad)" fill-opacity="0.5"/>
    <rect x="140" y="130" width="28" height="200" rx="6" fill="url(#goldGrad)" fill-opacity="0.85"/>
    <rect x="185" y="80" width="28" height="250" rx="6" fill="url(#goldGrad)"/>
    <rect x="230" y="160" width="28" height="170" rx="6" fill="url(#emeraldGrad)"/>

    <!-- Upward Trend Line with Node -->
    <path d="M 40 260 Q 120 180 199 90 T 260 50" fill="none" stroke="#FDE68A" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="260" cy="50" r="10" fill="#FDE68A" filter="url(#glow)"/>
    <circle cx="260" cy="50" r="5" fill="#070A14"/>

    <!-- African Continent Contour overlay (artistic vector) -->
    <path d="M 60 40 
             C 120 20, 220 20, 240 60 
             C 260 90, 240 130, 220 160 
             C 200 190, 180 230, 170 280 
             C 160 320, 140 350, 130 355
             C 120 350, 110 310, 100 270 
             C 85 220, 50 170, 45 130 
             C 40 90, 40 50, 60 40 Z" 
          fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" opacity="0.95"/>
  </g>

  <!-- Typography: Letter 'A' with Golden Horizon -->
  <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" text-anchor="middle" fill="#FFFFFF" letter-spacing="4">
    L’AFRICONOMIST
  </text>
  <text x="256" y="475" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="18" text-anchor="middle" fill="#F59E0B" letter-spacing="2">
    لافريكونوميست
  </text>
</svg>
